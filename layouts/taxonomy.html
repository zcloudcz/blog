{{ define "main" }}
<div class="wrap">
  <div class="list-head"><h1>{{ i18n "allTags" }}</h1></div>
  <ul class="tag-cloud">
  {{- range .Data.Terms.ByCount }}
    <li><a class="pill" href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }} · {{ .Count }}</a></li>
  {{- end }}
  </ul>
</div>
{{ end }}
