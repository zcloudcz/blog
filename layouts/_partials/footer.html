<footer class="site-footer">
  <div class="wrap">
    <span>&copy; {{ now.Year }} <a href="{{ site.Params.mainSite }}{{ if eq site.Language.Lang "en" }}/en/{{ end }}">zcloud.cz</a>, {{ site.Params.author }}</span>
    <span>
      <a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a>
      · <a href="{{ site.Params.linkedin }}">LinkedIn</a>
      {{- with site.Home.OutputFormats.Get "rss" }} · <a href="{{ .RelPermalink }}">{{ i18n "rss" }}</a>{{ end }}
    </span>
  </div>
</footer>
