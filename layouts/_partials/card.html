<article class="card">
  <h2 class="card-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  {{ partial "meta.html" . }}
  <p class="card-summary">{{ .Description | default .Summary | plainify | truncate 260 }}</p>
  <a class="more" href="{{ .RelPermalink }}">{{ i18n "readMore" }} &rarr;</a>
</article>
