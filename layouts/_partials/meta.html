<p class="meta">
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time>
  · {{ .ReadingTime }} {{ i18n "minRead" }}
  {{- with .GetTerms "tags" }} ·
    {{- range $i, $t := . }}{{ if $i }},{{ end }} <a class="tag" href="{{ $t.RelPermalink }}">#{{ $t.LinkTitle }}</a>{{ end }}
  {{- end }}
</p>
