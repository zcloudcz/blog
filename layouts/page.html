{{ define "main" }}
<article class="post">
  <header>
    <h1 data-pagefind-meta="title">{{ .Title }}</h1>
    {{ partial "meta.html" . }}
  </header>
  <div class="content" data-pagefind-body>
    {{ .Content }}
  </div>
  {{- with .Params.tags }}
  <div data-pagefind-ignore hidden>{{ range . }}<span data-pagefind-filter="tag">{{ . }}</span>{{ end }}</div>
  {{- end }}
  <nav class="post-nav">
    {{- with .PrevInSection }}<a href="{{ .RelPermalink }}">&larr; {{ .Title }}</a>{{ else }}<span></span>{{ end }}
    {{- with .NextInSection }}<a href="{{ .RelPermalink }}">{{ .Title }} &rarr;</a>{{ end }}
  </nav>
</article>
{{ end }}
