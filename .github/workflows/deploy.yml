name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  # Daily rebuild publishes posts whose date has arrived (buildFuture = false).
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.169.0
  PAGEFIND_VERSION: 1.6.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Content check
        run: node scripts/check-content.mjs
      - name: Install Hugo
        run: |
          curl -sSL -o /tmp/hugo.tgz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf /tmp/hugo.tgz -C /tmp hugo
          sudo mv /tmp/hugo /usr/local/bin/hugo
      - name: Build site
        env:
          TZ: Europe/Prague
        run: hugo --minify --gc
      - name: Build search index
        run: npx --yes "pagefind@${PAGEFIND_VERSION}" --site public
      - name: Check output for em dash
        run: |
          if grep -rl $'\xe2\x80\x94' public --include='*.html' --include='*.xml'; then
            echo "Em dash found in generated output"; exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
